<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control Center — PB Bake House</title>
<meta name="theme-color" content="#2D1B12">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/images/logo.png">
<link rel="apple-touch-icon" href="/images/logo.png">
<link rel="stylesheet" href="/admin/css/admin.css">
<script>
  /* Theme is applied before paint so there is no flash. Presentation only. */
  (function(){try{var t=localStorage.getItem('pb_theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
  function toggleAdminTheme(){
    var r=document.documentElement,n=r.getAttribute('data-theme')==='dark'?'light':'dark';
    r.setAttribute('data-theme',n);
    try{localStorage.setItem('pb_theme',n);}catch(e){}
    var b=document.getElementById('themeBtn'); if(b) b.textContent = n==='dark'?'\u263e':'\u2600';
  }
  document.addEventListener('DOMContentLoaded',function(){
    var b=document.getElementById('themeBtn');
    if(b) b.textContent = document.documentElement.getAttribute('data-theme')==='dark'?'\u263e':'\u2600';
  });
  // Swap the "PB" placeholder for the real logo, same file the storefront uses.
  (function(){
    var candidates=['/images/logo.png','/images/logo.jpg','/images/logo.jpeg','/images/logo.webp','/images/logo.svg'];
    (function tryNext(list){
      if(!list.length) return;
      var url=list[0], img=new Image();
      img.onload=function(){
        document.addEventListener('DOMContentLoaded',function(){
          ['loginLogo','sbLogoMark'].forEach(function(id){
            var el=document.getElementById(id);
            if(el){ el.innerHTML='<img src="'+url+'" alt="PB Bake House logo">'; el.classList.add('has-logo'); }
          });
        });
      };
      img.onerror=function(){ tryNext(list.slice(1)); };
      img.src=url;
    })(candidates);
  })();
</script>
</head>
<body>

<!-- LOGIN -->
<div id="loginView" class="login-wrap">
  <div class="login-card">
    <div class="login-logo" id="loginLogo">PB</div>
    <h1>Control Center</h1>
    <p class="sub">PB Bake House</p>
    <div class="field"><label>Email</label><input id="loginEmail" type="email" placeholder="you@pbbakehouse.com"></div>
    <div class="field"><label>Password</label><input id="loginPassword" type="password" placeholder="Your password"></div>
    <button class="btn btn-primary btn-block" id="loginBtn" onclick="doLogin()">Sign In</button>
    <p style="text-align:center;font-size:13px;color:var(--ink-faint);margin-top:14px">Staff access only</p>
  </div>
</div>

<!-- APP -->
<div id="appView" class="app hide">
  <aside class="sidebar" id="sidebar">
    <div class="sb-logo"><div class="m" id="sbLogoMark">PB</div><div class="t">PB Bake House<small>CONTROL CENTER</small></div></div>
    <div id="navMenu"></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')" aria-label="Toggle sidebar menu">&#9776;</button>
      <h2 id="pageTitle">Dashboard</h2>
      <div class="search-box">
        <span class="si" id="searchIcon" style="cursor:pointer" role="button" tabindex="0" aria-label="Run search">&#128269;</span>
        <input id="globalSearch" placeholder="Search orders, products, customers" autocomplete="off">
        <div id="searchResults" class="search-results hide"></div>
      </div>
      <button class="top-icon" id="themeBtn" onclick="toggleAdminTheme()" title="Switch theme" aria-label="Switch theme">&#9728;</button>
      <button class="top-icon" onclick="playAlert(false)" title="Test alert sound" aria-label="Test alert sound">&#128266;</button>
      <button class="top-icon" onclick="go('notifications')" title="Notifications" aria-label="Notifications">&#128276;<span class="nb hide" id="notifBadge">0</span></button>
      <div class="avatar" id="avatar" onclick="logout()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();logout();}" title="Log out" role="button" tabindex="0" aria-label="Log out">A</div>
    </div>

    <div class="content" id="content"></div>
  </div>
</div>

<!-- NEW ORDER ALERT -->
<div class="alert-bg" id="alertBg">
  <div class="alert-card">
    <div class="ring">&#128276;</div>
    <h2>New order</h2>
    <div class="amt" id="alertAmt">-</div>
    <div class="meta" id="alertMeta">-</div>
    <div class="alert-items" id="alertItems"></div>
    <button class="btn btn-red btn-block" style="font-size:16px;padding:14px" onclick="acceptOrder()">Accept order</button>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn btn-outline btn-block" onclick="viewAlertOrder()">View details</button>
      <button class="btn btn-ghost btn-block" onclick="rejectOrder()" style="color:var(--red)">Reject</button>
    </div>
    <div style="font-size:12px;color:var(--ink-faint);margin-top:10px">The alarm rings until you accept or reject</div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="modal-h"><h3 id="modalTitle">Modal</h3><button class="x" onclick="closeModal()" aria-label="Close">&times;</button></div>
    <div class="modal-b" id="modalBody"></div>
    <div class="modal-f" id="modalFoot"></div>
  </div>
</div>

<div class="toast-host" id="toastHost"></div>
