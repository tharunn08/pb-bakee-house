<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Menu — PB Bake House</title>
<meta name="description" content="Browse the full PB Bake House menu — eggless cakes, pastries, breads and cookies baked fresh daily in Girinagar, Bengaluru. Order online for same-day delivery.">
<meta name="theme-color" content="#8B4513">
<link rel="canonical" href="https://pbbakehouse.com/menu.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="PB Bake House">
<meta property="og:title" content="The Menu — PB Bake House">
<meta property="og:description" content="Browse the full PB Bake House menu — eggless cakes, pastries, breads and cookies baked fresh daily in Girinagar, Bengaluru. Order online for same-day delivery.">
<meta property="og:url" content="https://pbbakehouse.com/menu.html">
<meta property="og:image" content="https://pbbakehouse.com/images/logo.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="The Menu — PB Bake House">
<meta name="twitter:description" content="Browse the full PB Bake House menu — eggless cakes, pastries, breads and cookies baked fresh daily in Girinagar, Bengaluru.">
<meta name="twitter:image" content="https://pbbakehouse.com/images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/images/logo.png">
<link rel="apple-touch-icon" href="/images/logo.png">
<link rel="stylesheet" href="/css/style.css?v=20260808m">
<script src="/js/ui.js"></script>
</head>
<body>

<div class="pb-loader" id="pbLoader">
  <div class="pbl-inner">
    <div class="pbl-ring"><span class="pbl-mark">PB</span></div>
    <div class="pbl-word">Bake House</div>
    <div class="pbl-bar"><i></i></div>
  </div>
</div>

<section class="section container menu-section">
  <header class="menu-head">
    <div class="menu-head-copy">
      <h1 id="menuTitle">The <span>menu</span></h1>
      <span id="resultCount" class="menu-count">Loading products…</span>
    </div>
    <div class="menu-head-tools">
      <div class="search-wrap">
        <input id="searchBox" placeholder="Search cakes, breads, cookies…" aria-label="Search the menu">
        <span class="si">&#128269;</span>
      </div>
      <div class="sort-wrap">
        <select id="sortBox" aria-label="Sort products">
          <option value="new">Newest first</option>
          <option value="popular">Most popular</option>
          <option value="price_low">Price: low to high</option>
          <option value="price_high">Price: high to low</option>
          <option value="name">Name A–Z</option>
        </select>
      </div>
    </div>
  </header>

  <div id="couponStrip" class="coupon-strip hide"></div>

  <div class="menu-layout">
    <aside class="filters">
      <div class="filter-group">
        <h4>Categories</h4>
        <div class="filter-list" id="catChips"></div>
      </div>
      <div class="filter-group">
        <h4>Good to know</h4>
        <div class="rule-strip" style="margin-top:0">
          <span>&#129370; Eggless Available</span>
          <span>&#127807; Pure veg kitchen</span>
          <span>&#9889; Under 30 min nearby</span>
        </div>
      </div>
      <div class="filter-group">
        <h4>Need it today?</h4>
        <p style="font-size:12.5px;color:var(--ink-soft);margin-bottom:14px">Pick a slot at checkout, or choose free store pickup.</p>
        <a href="/track.html" class="btn btn-outline btn-sm btn-block">Track an order</a>
      </div>
    </aside>

    <div>
      <div class="active-filters" id="activeFilters" hidden></div>
  <div class="grid" id="grid">
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      </div>
      <div style="text-align:center;margin-top:34px">
        <button class="btn btn-outline" id="loadMoreBtn" style="display:none" onclick="loadMore()">Load more</button>
      </div>
    </div>
  </div>
</section>

<!-- Quick view -->
<div class="qv-bg" id="qvBg" onclick="if(event.target===this)closeQuick()">
  <div class="qv" id="qvBody" role="dialog" aria-modal="true" aria-label="Product quick view"></div>
</div>

<script src="/js/main.js"></script>
<script>
mountShell('menu');

// Show active coupons customers can use
api('/coupons/active').then(({ coupons }) => {
  if (!coupons || !coupons.length) return;
  const strip = document.getElementById('couponStrip');
  strip.innerHTML = `<div class="coupon-head">Offers on today — tap to copy</div><div class="coupon-cards">` +
    coupons.map(c => {
      const val = c.type === 'percent' ? `${c.value}% off` : `${rupee(c.value)} off`;
      const cond = Number(c.min_order) > 0 ? `on orders above ${rupee(c.min_order)}` : 'on all orders';
      const cap = Number(c.max_discount) > 0 && c.type === 'percent' ? ` (up to ${rupee(c.max_discount)})` : '';
      return `<div class="coupon-card" onclick="copyCoupon('${esc(c.code)}')">
        <div class="coupon-left"><div class="coupon-val">${val}</div><div class="coupon-cond">${cond}${cap}</div></div>
        <div class="coupon-code">${esc(c.code)}<span>COPY</span></div>
      </div>`;
    }).join('') + `</div>`;
  strip.classList.remove('hide');
  fitSoon();
}).catch(() => {});

function copyCoupon(code) {
  navigator.clipboard?.writeText(code).then(() => toast(`Coupon ${code} copied`, 'ok')).catch(() => toast(`Use code: ${code}`, 'ok'));
}

/* ---- Fit the first row of products above the fold -------------------------
   A customer arriving from the nav should see row one complete - photo, name,
   price and both buttons - without scrolling and without anything clipped.
   Card height = photo + body, and the body is fixed by its content, so the
   only lever is the photo. We measure where the grid actually starts (which
   moves depending on whether the offers strip or filter chips are showing)
   and give the photo whatever is left, inside sane limits.                  */
const IMG_MIN = 132, IMG_MAX = 300, FOLD_GAP = 14;

function fitFirstRow() {
  const section = document.querySelector('.menu-section');
  const grid = document.getElementById('grid');
  if (!section || !grid) return;

  // Distance from the top of the document, so the sum still holds if a re-fit
  // fires after the customer has scrolled.
  const top = grid.getBoundingClientRect().top + window.scrollY;

  // Every card in a row stretches to the tallest one, so the row is governed by
  // the tallest body in it - a card carrying a rating line or a "only 2 left"
  // note is taller than a plain one. Measure across the whole first row.
  const cols = getComputedStyle(grid).gridTemplateColumns.split(' ').filter(Boolean).length || 1;
  const bodies = [...grid.querySelectorAll('.card .card-body')].slice(0, cols);
  const bodyH = bodies.length
    ? Math.ceil(Math.max(...bodies.map(b => b.getBoundingClientRect().height)))
    : (window.innerWidth <= 640 ? 138 : 152);

  const room = window.innerHeight - top - bodyH - FOLD_GAP;
  const px = Math.max(IMG_MIN, Math.min(IMG_MAX, Math.floor(room)));
  section.style.setProperty('--menu-img-h', px + 'px');
}

/* Re-fit whenever the space above the grid changes. */
let fitTimer;
const refit = () => { clearTimeout(fitTimer); fitTimer = setTimeout(fitFirstRow, 60); };
window.addEventListener('resize', refit);
window.addEventListener('orientationchange', refit);
/* Fonts land after first paint and change the body height by a pixel or two. */
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitFirstRow);
/* Measure on the frame after the grid paints, so layout has settled. */
const fitSoon = () => requestAnimationFrame(fitFirstRow);

const params = new URLSearchParams(location.search);
let state = { category: params.get('category') || 'all', search: params.get('search') || '',
              occasion: params.get('occasion') || '', sort: 'new', favourites: params.get('favourites') === '1' };
document.getElementById('searchBox').value = state.search;

if (state.favourites) {
  document.getElementById('menuTitle').innerHTML = 'Your <span>favourites</span>';
  const searchWrap = document.getElementById('searchBox')?.closest('.search-wrap');
  if (searchWrap) searchWrap.style.display = 'none';
}

api('/products/categories').then(({ categories }) => {
  const el = document.getElementById('catChips');
  el.innerHTML = `<button class="chip ${state.category === 'all' ? 'active' : ''}" data-cat="all">All items</button>` +
    categories.map(c => `<button class="chip ${state.category === c.name ? 'active' : ''}" data-cat="${esc(c.name)}">${esc(c.name)} <span style="opacity:.6">${c.count}</span></button>`).join('');
  el.querySelectorAll('.chip').forEach(b => b.onclick = () => {
    state.category = b.dataset.cat;
    el.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); load();
  });
});

let timer;
document.getElementById('searchBox').oninput = e => { clearTimeout(timer); timer = setTimeout(() => { state.search = e.target.value.trim(); load(); }, 350); };
document.getElementById('sortBox').onchange = e => { state.sort = e.target.value; load(); };

/* Cache the last-loaded page so Quick View needs no extra request. */
let lastProducts = [];

/* A removable chip for whichever filters are active, so a customer arriving
   from an occasion tile can always see and undo it. */
function paintActiveFilters() {
  const host = document.getElementById('activeFilters');
  if (!host) return;
  const chips = [];
  if (state.occasion) chips.push({ label: state.occasion, key: 'occasion' });
  if (state.search) chips.push({ label: '\u201c' + state.search + '\u201d', key: 'search' });
  if (state.category !== 'all') chips.push({ label: state.category, key: 'category' });
  host.innerHTML = chips.length
    ? chips.map(c => `<button class="afilter" onclick="dropFilter('${c.key}')">${esc(c.label)} <span>&times;</span></button>`).join('')
      + (chips.length > 1 ? '<button class="afilter afilter-clear" onclick="location.href=\'/menu.html\'">Clear all</button>' : '')
    : '';
  host.hidden = !chips.length;
  fitSoon();
}

function dropFilter(key) {
  if (key === 'category') state.category = 'all';
  else state[key] = '';
  if (key === 'search') { const b = document.getElementById('searchBox'); if (b) b.value = ''; }
  const q = new URLSearchParams();
  if (state.category !== 'all') q.set('category', state.category);
  if (state.search) q.set('search', state.search);
  if (state.occasion) q.set('occasion', state.occasion);
  history.replaceState(null, '', '/menu.html' + (q.toString() ? '?' + q : ''));
  load();
}

/* Paginated: 24 products per page, "Load more" fetches the next page so the
   first paint is fast even when the counter has hundreds of items. */
const PAGE_SIZE = 24;
let pageNum = 1, pageHasMore = false, loadingMore = false, totalCount = 0;

/* One tidy line under the title: how much of the catalogue is on screen. */
function paintResultCount() {
  const el = document.getElementById('resultCount');
  if (!el) return;
  if (!totalCount) { el.textContent = 'No items matched your search'; return; }
  const shown = Math.min(lastProducts.length, totalCount);
  el.textContent = shown < totalCount
    ? `Showing ${shown} of ${totalCount} items`
    : `${totalCount} item${totalCount === 1 ? '' : 's'} available`;
}

async function load() {
  pageNum = 1;
  const grid = document.getElementById('grid');
  grid.innerHTML = '<div class="skeleton"></div>'.repeat(6);
  document.getElementById('loadMoreBtn').style.display = 'none';

  if (state.favourites) return loadFavourites();

  const q = new URLSearchParams({ limit: PAGE_SIZE, page: pageNum, sort: state.sort });
  if (state.category !== 'all') q.set('category', state.category);
  if (state.search) q.set('search', state.search);
  if (state.occasion) q.set('occasion', state.occasion);
  try {
    const { products, total, pages } = await api('/products?' + q);
    lastProducts = products;
    totalCount = total || 0;
    pageHasMore = pageNum < pages;
    paintResultCount();
    paintActiveFilters();
    grid.innerHTML = products.length ? products.map(cardWithQuick).join('')
      : `<div class="empty" style="grid-column:1/-1"><div class="ei">&#128269;</div>
         <p>Nothing matched that search.<br>Try a broader word, or clear the filters.</p>
         <button class="btn btn-outline btn-sm" style="margin-top:18px" onclick="location.href='/menu.html'">Clear filters</button></div>`;
    document.getElementById('loadMoreBtn').style.display = pageHasMore ? '' : 'none';
    fitSoon();
  } catch (e) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="ei">&#9888;</div><p>${esc(e.message)}</p>
      <button class="btn btn-outline btn-sm" style="margin-top:18px" onclick="load()">Try again</button></div>`;
  }
}

async function loadMore() {
  if (loadingMore || !pageHasMore) return;
  loadingMore = true;
  const btn = document.getElementById('loadMoreBtn');
  btn.disabled = true; btn.textContent = 'Loading…';
  pageNum += 1;
  const q = new URLSearchParams({ limit: PAGE_SIZE, page: pageNum, sort: state.sort });
  if (state.category !== 'all') q.set('category', state.category);
  if (state.search) q.set('search', state.search);
  if (state.occasion) q.set('occasion', state.occasion);
  try {
    const { products, pages } = await api('/products?' + q);
    lastProducts = lastProducts.concat(products);
    pageHasMore = pageNum < pages;
    document.getElementById('grid').insertAdjacentHTML('beforeend', products.map(cardWithQuick).join(''));
    paintResultCount();
    btn.style.display = pageHasMore ? '' : 'none';
  } catch (e) { toast(e.message, 'err'); pageNum -= 1; }
  loadingMore = false;
  btn.disabled = false; btn.textContent = 'Load more';
}

/* Favourites view — pulled from the browser-only wishlist (see UI.wish in
   ui.js). We only need each saved product's live details, one request
   per id, so a customer's saved list never depends on pagination order. */
async function loadFavourites() {
  const grid = document.getElementById('grid');
  const ids = (window.UI ? UI.wish.read() : []);
  document.getElementById('resultCount').textContent = ids.length ? `${ids.length} saved item${ids.length === 1 ? '' : 's'}` : 'No favourites yet';
  document.getElementById('activeFilters').hidden = true;
  if (!ids.length) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="ei">&#9825;</div>
      <p>You haven't saved anything yet.<br>Tap the heart on any product to save it here.</p>
      <button class="btn btn-outline btn-sm" style="margin-top:18px" onclick="location.href='/menu.html'">Browse the menu</button></div>`;
    return;
  }
  try {
    const results = await Promise.all(ids.map(id => api('/products/' + id).then(r => r.product).catch(() => null)));
    const products = results.filter(Boolean);
    lastProducts = products;
    grid.innerHTML = products.length ? products.map(cardWithQuick).join('')
      : `<div class="empty" style="grid-column:1/-1"><div class="ei">&#9825;</div><p>Your saved items are no longer available.</p></div>`;
    fitSoon();
  } catch (e) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="ei">&#9888;</div><p>${esc(e.message)}</p></div>`;
  }
}

/* Add a Quick View affordance without changing the shared card. */
function cardWithQuick(p) {
  return productCard(p).replace(
    '<div class="card-foot">',
    `<button class="btn btn-ghost btn-sm" style="margin-top:4px;padding:2px 0;min-height:auto;justify-content:flex-start;font-size:11.5px;letter-spacing:.06em"
       onclick="openQuick('${p.id}')">Quick view</button><div class="card-foot">`
  );
}

function openQuick(id) {
  const p = lastProducts.find(x => String(x.id) === String(id));
  if (!p) return;
  const hasOffer = p.offer_price && Number(p.offer_price) < Number(p.price);
  const off = hasOffer ? Math.round((1 - p.offer_price / p.price) * 100) : 0;
  const out = p.stock <= 0 || !p.is_available;
  const payload = JSON.stringify(p).replace(/'/g, '&#39;');
  document.getElementById('qvBody').innerHTML = `
    <button class="qv-close" onclick="closeQuick()" aria-label="Close">&#10005;</button>
    <div class="qv-img">${productImage(p)}</div>
    <div class="qv-body">
      <div class="card-cat">${esc(p.category)}</div>
      <h3 style="font-size:26px;font-weight:800;margin:6px 0 4px">${esc(p.name)}</h3>
      ${Number(p.review_count) > 0 ? UI.stars(p.rating, p.review_count) : ''}
      <p style="font-size:13.5px;color:var(--ink-soft);margin:14px 0;line-height:1.7">${esc(p.description) || 'Baked to order the morning it reaches you.'}</p>
      <div class="price-row">
        <span class="price">${rupee(p.offer_price || p.price)}</span>
        ${hasOffer ? `<span class="price-old">${rupee(p.price)}</span><span class="price-off">Save ${off}%</span>` : ''}
      </div>
      <div class="rule-strip">
        ${p.weight ? `<span>${esc(p.weight)}</span>` : ''}
        <span>${p.prep_minutes || 30} min prep</span>
        ${p.is_eggless ? '<span style="color:var(--ok)">Eggless</span>' : ''}
        ${out ? '<span style="color:var(--red)">Sold out</span>' : '<span style="color:var(--ok)">In stock</span>'}
      </div>
      <div style="margin-top:auto;padding-top:24px;display:flex;gap:10px;flex-wrap:wrap">
        ${out
          ? '<button class="btn btn-outline btn-block" disabled>Sold out</button>'
          : `<button class="btn btn-primary" style="flex:1" onclick='Cart.add(${payload});closeQuick()'>Add to box</button>
             <a href="/product.html?id=${p.id}" class="btn btn-outline" style="flex:1">Full details</a>`}
      </div>
    </div>`;
  document.getElementById('qvBg').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeQuick() {
  document.getElementById('qvBg').classList.remove('show');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeQuick(); });

load();
</script>
</body>
</html>
