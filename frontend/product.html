<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product — PB Bake House</title>
<meta name="description" id="metaDesc" content="Shop eggless cakes, pastries, breads and cookies at PB Bake House — freshly baked every day in Girinagar, Bengaluru.">
<meta name="theme-color" content="#8B4513">
<link rel="canonical" id="metaCanonical" href="https://pbbakehouse.com/product.html">
<meta property="og:type" content="product">
<meta property="og:site_name" content="PB Bake House">
<meta property="og:title" id="metaOgTitle" content="Product — PB Bake House">
<meta property="og:description" id="metaOgDesc" content="Shop eggless cakes, pastries, breads and cookies at PB Bake House — freshly baked every day in Girinagar, Bengaluru.">
<meta property="og:url" id="metaOgUrl" content="https://pbbakehouse.com/product.html">
<meta property="og:image" id="metaOgImage" content="https://pbbakehouse.com/images/logo.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" id="metaTwTitle" content="Product — PB Bake House">
<meta name="twitter:description" id="metaTwDesc" content="Shop eggless cakes, pastries, breads and cookies at PB Bake House.">
<meta name="twitter:image" id="metaTwImage" content="https://pbbakehouse.com/images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/images/logo.png">
<link rel="apple-touch-icon" href="/images/logo.png">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/ui.js"></script>
</head>
<body>

<div class="pb-loader" id="pbLoader">
  <div class="pbl-inner">
    <div class="pbl-ring"><span class="pbl-mark">PB</span></div>
    <div class="pbl-word">Bake House</div>
    <div class="pbl-bar"><i></i></div>
  </div>
</div>

<section class="section container"><div id="pd"><div class="skeleton" style="height:460px"></div></div></section>

<section class="section container" style="padding-top:0" id="relatedSection" hidden>
  <div class="section-head">
    <div>
      <span class="eyebrow">You might also like</span>
      <h2>Goes well <span>with this</span></h2>
      <p id="relatedSub">More from the same counter.</p>
    </div>
    <a href="/menu.html" class="btn btn-outline btn-sm">See everything</a>
  </div>
  <div class="grid" id="relatedGrid"></div>
</section>

<section class="section container" style="padding-top:0" id="recentSection" hidden>
  <div class="section-head">
    <div>
      <span class="eyebrow">Your history</span>
      <h2>Recently <span>viewed</span></h2>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="clearRecent()">Clear</button>
  </div>
  <div class="grid" id="recentGrid"></div>
</section>

<section class="section container" style="padding-top:0" id="reviewsSection" hidden>
  <div class="section-head">
    <div>
      <span class="eyebrow">Feedback</span>
      <h2>Customer <span>reviews</span></h2>
    </div>
  </div>
  <div class="panel" style="margin-bottom:20px" id="reviewList"></div>
  <div class="panel">
    <h3>Leave a review</h3>
    <div class="field-row">
      <div class="field"><label for="rName">Your name *</label><input id="rName" placeholder="Name"></div>
      <div class="field"><label for="rRating">Rating *</label>
        <select id="rRating">
          <option value="5">5 stars — excellent</option>
          <option value="4">4 stars — good</option>
          <option value="3">3 stars — average</option>
          <option value="2">2 stars — poor</option>
          <option value="1">1 star — bad</option>
        </select>
      </div>
    </div>
    <div class="field"><label for="rComment">Comment</label><textarea id="rComment" placeholder="How was it?"></textarea></div>
    <button class="btn btn-primary" onclick="submitReview()">Post review</button>
  </div>
</section>

<script src="/js/main.js"></script>
<script>
mountShell('menu');
const pid = new URLSearchParams(location.search).get('id');
let product = null, qty = 1;
if (!pid) document.getElementById('pd').innerHTML = '<div class="empty"><div class="ei">&#127856;</div><p>No product selected.</p><a href="/menu.html" class="btn btn-outline btn-sm" style="margin-top:18px">Back to the menu</a></div>';
else load();

async function load() {
  try {
    const { product: p } = await api('/products/' + pid);
    product = p;
    document.title = p.name + ' — PB Bake House';
    setProductSEO(p);
    const hasOffer = p.offer_price && Number(p.offer_price) < Number(p.price);
    const off = hasOffer ? Math.round((1 - p.offer_price / p.price) * 100) : 0;
    const out = p.stock <= 0 || !p.is_available;
    const low = !out && p.stock <= (p.low_stock_at || 5);
    document.getElementById('pd').innerHTML =
      '<div class="pd"><div class="pd-img">' + productImage(p) + '</div><div>' +
      '<div class="card-cat">' + esc(p.category) + '</div>' +
      '<h1 style="font-size:clamp(30px,3.6vw,44px);font-weight:800;letter-spacing:-.025em;margin:8px 0 10px;line-height:1.08">' + esc(p.name) + '</h1>' +
      (p.review_count > 0 ? '<div class="stars">' + '\u2605'.repeat(Math.round(p.rating)) + '<span style="color:var(--ink-faint);font-size:13px;letter-spacing:0"> ' + p.rating + ' · ' + p.review_count + ' review' + (p.review_count === 1 ? '' : 's') + '</span></div>' : '') +
      '<p style="color:var(--ink-soft);margin:18px 0;line-height:1.8;max-width:52ch">' + (esc(p.description) || 'Baked to order the morning it reaches you.') + '</p>' +
      '<div class="price-row" style="margin:22px 0"><span class="price" style="font-size:38px">' + rupee(p.offer_price || p.price) + '</span>' +
      (hasOffer ? '<span class="price-old" style="font-size:17px">' + rupee(p.price) + '</span><span class="price-off">Save ' + off + '%</span>' : '') + '</div>' +
      '<div class="rule-strip" style="margin-bottom:24px">' +
      (p.weight ? '<span>Weight: ' + esc(p.weight) + '</span>' : '') +
      '<span>Prep time: ' + (p.prep_minutes || 30) + ' min</span>' +
      (p.is_eggless ? '<span style="color:var(--ok)">Eggless</span>' : '') +
      (out ? '<span style="color:var(--red)">Sold out</span>' : low ? '<span style="color:var(--warn)">Only ' + p.stock + ' left</span>' : '<span style="color:var(--ok)">In stock</span>') + '</div>' +
      (out ? '<button class="btn btn-outline btn-block" disabled>Sold out — back tomorrow</button>'
           : '<div style="display:flex;gap:14px;align-items:center;margin-bottom:18px"><div class="qty" style="margin:0"><button onclick="bump(-1)" aria-label="Decrease">\u2212</button><span id="qtyVal">1</span><button onclick="bump(1)" aria-label="Increase">+</button></div><span style="font-size:12.5px;color:var(--ink-faint)">Max ' + p.stock + ' today</span></div>' +
             '<div style="display:flex;gap:11px;flex-wrap:wrap"><button class="btn btn-primary" style="flex:1;min-width:150px" onclick="addNow()">Add to box</button><button class="btn btn-red" style="flex:1;min-width:150px" onclick="buyNow()">Buy now</button></div>' +
             '<div class="rule-strip" style="margin-top:22px"><span>&#128666; Under 30 min nearby</span><span>&#128274; Secure payment</span><span>&#127807; Pure veg kitchen</span></div>') +
      '</div></div>';
    loadReviews();
    loadRelated();
    loadRecent();
    if (window.UI && UI.recent) UI.recent.push(p.id);
  } catch (e) {
    document.getElementById('pd').innerHTML = '<div class="empty"><div class="ei">&#9888;</div><p>' + esc(e.message) + '</p><a href="/menu.html" class="btn btn-outline btn-sm" style="margin-top:18px">Back to the menu</a></div>';
  }
}
/* ---------- SEO: fill meta tags + JSON-LD once the real product loads ---------- */
function setProductSEO(p) {
  const base = 'https://pbbakehouse.com';
  const url = base + '/product.html?id=' + encodeURIComponent(p.id);
  const desc = (p.description ? String(p.description).slice(0, 155) :
    (p.name + ' — freshly baked, 100% eggless, from PB Bake House, Girinagar, Bengaluru.'));
  const set = (id, attr, val) => { const el = document.getElementById(id); if (el) el.setAttribute(attr, val); };
  set('metaDesc', 'content', desc);
  set('metaCanonical', 'href', url);
  set('metaOgTitle', 'content', p.name + ' — PB Bake House');
  set('metaOgDesc', 'content', desc);
  set('metaOgUrl', 'content', url);
  set('metaTwTitle', 'content', p.name + ' — PB Bake House');
  set('metaTwDesc', 'content', desc);
  if (p.image) { set('metaOgImage', 'content', p.image); set('metaTwImage', 'content', p.image); }

  const ld = {
    '@context': 'https://schema.org',
    '@type': 'Product',
    name: p.name,
    description: desc,
    image: p.image ? [p.image] : undefined,
    brand: { '@type': 'Brand', name: 'PB Bake House' },
    offers: {
      '@type': 'Offer',
      url,
      priceCurrency: 'INR',
      price: String(p.offer_price || p.price || '0'),
      availability: (p.stock > 0 && p.is_available) ? 'https://schema.org/InStock' : 'https://schema.org/OutOfStock',
    },
  };
  if (p.review_count > 0) {
    ld.aggregateRating = { '@type': 'AggregateRating', ratingValue: String(p.rating || '5'), reviewCount: String(p.review_count) };
  }
  let tag = document.getElementById('productLd');
  if (!tag) { tag = document.createElement('script'); tag.type = 'application/ld+json'; tag.id = 'productLd'; document.head.appendChild(tag); }
  tag.textContent = JSON.stringify(ld);
}

function bump(d) { qty = Math.max(1, Math.min(qty + d, product.stock)); document.getElementById('qtyVal').textContent = qty; }
function addNow() { Cart.add(product, qty); }
function buyNow() { Cart.add(product, qty); location.href = '/checkout.html'; }

/* ---------- RELATED + RECENTLY VIEWED ---------- */
async function loadRelated() {
  try {
    const { products } = await api('/products?category=' + encodeURIComponent(product.category) + '&limit=12');
    const list = (products || []).filter(p => String(p.id) !== String(product.id)).slice(0, 4);
    if (!list.length) return;
    document.getElementById('relatedSub').textContent = 'More from ' + product.category + '.';
    document.getElementById('relatedGrid').innerHTML = list.map(productCard).join('');
    document.getElementById('relatedSection').hidden = false;
    if (window.UI) UI.refresh();
  } catch (e) { /* leave the section hidden */ }
}

async function loadRecent() {
  if (!window.UI || !UI.recent) return;
  const ids = UI.recent.read().filter(id => String(id) !== String(product.id)).slice(0, 4);
  if (!ids.length) return;
  try {
    const found = await Promise.all(ids.map(id =>
      api('/products/' + id).then(r => r.product).catch(() => null)));
    const list = found.filter(Boolean);
    if (!list.length) return;
    document.getElementById('recentGrid').innerHTML = list.map(productCard).join('');
    document.getElementById('recentSection').hidden = false;
    if (window.UI) UI.refresh();
  } catch (e) { /* leave the section hidden */ }
}

function clearRecent() {
  UI.recent.clear();
  document.getElementById('recentSection').hidden = true;
  toast('History cleared', 'ok');
}

async function loadReviews() {
  try {
    const { reviews } = await api('/reviews/' + product.id);
    document.getElementById('reviewsSection').hidden = false;
    document.getElementById('reviewList').innerHTML = reviews.length
      ? reviews.map(r => '<div style="padding:18px 0;border-bottom:1px solid var(--line)"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center"><b style="font-family:var(--font-display);font-size:16px;font-weight:600">' + esc(r.name) + '</b><span class="stars">' + '\u2605'.repeat(r.rating) + '</span></div><p style="font-size:14px;color:var(--ink-soft);margin-top:8px;line-height:1.7">' + esc(r.comment) + '</p>' + (r.reply ? '<div style="margin-top:12px;padding:14px 16px;background:var(--cream);border:1px solid var(--glass-line);border-radius:14px;font-size:13.5px"><b style="color:var(--primary)">PB Bake House:</b> ' + esc(r.reply) + '</div>' : '') + '</div>').join('')
      : '<div class="empty" style="padding:28px"><div class="ei">&#9997;</div><p>No reviews yet. Be the first to say something.</p></div>';
  } catch (e) { document.getElementById('reviewsSection').hidden = false; }
}

async function submitReview() {
  if (!rName.value.trim()) return toast('Enter your name first', 'err');
  try {
    const r = await api('/reviews', { method: 'POST', body: { product_id: product.id, name: rName.value.trim(), rating: rRating.value, comment: rComment.value.trim() } });
    toast(r.message, 'ok'); rName.value = ''; rComment.value = '';
  } catch (e) { toast(e.message, 'err'); }
}
</script>
</body>
</html>
